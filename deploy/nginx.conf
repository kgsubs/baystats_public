# baystats.com — nginx site config
# Deploy to: /etc/nginx/sites-available/baystats.com
# Symlink:   ln -s /etc/nginx/sites-available/baystats.com /etc/nginx/sites-enabled/
# SSL:       certbot --nginx -d baystats.com -d www.baystats.com

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name baystats.com www.baystats.com;
    return 301 https://baystats.com$request_uri;
}

# Redirect www → non-www (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.baystats.com;

    # certbot will populate these
    ssl_certificate     /etc/letsencrypt/live/baystats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baystats.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://baystats.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name baystats.com;

    # certbot will populate these
    ssl_certificate     /etc/letsencrypt/live/baystats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baystats.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Static frontend — point this at wherever you deploy the repo on the VPS
    root /var/www/baystats/dist;
    index index.html;

    # API → Express adapter on port 3457
    location /api/ {
        proxy_pass         http://127.0.0.1:3457;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all non-file routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
